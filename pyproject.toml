[project]
name = "alexa-ai-assistant"
version = "0.2.0"
description = "Personal Alexa skill that answers free-form questions about Moodle with an LLM and tool calling."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["lambda"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Deprecated method:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["lambda", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["assistant"]
